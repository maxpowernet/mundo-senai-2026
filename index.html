/* ===== JOGO 2: ROBÔ-ÔNIBUS ===== */
.g-robo{--c:var(--green);height:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(270px,27cqw,340px);gap:14px}

.rc{position:relative;border:1px solid #ffffff1f;display:grid;place-items:center}
.rc.g{background:repeating-linear-gradient(108deg,#829d72 0 8px,#90a878 9px 17px,#76936d 18px 20px)}
.rc.st{background:repeating-linear-gradient(2deg,#545d61 0 34px,#555e62 35px,#4f585c 37px)}
.rc.st.h:after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);border-top:3px dashed #e7dcc4b0}
.rc.st.v:before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 1px);border-left:3px dashed #e7dcc4b0}
.rc.goal{background:var(--green);border:3px solid #fff;color:#fff;font:700 calc(var(--cell)*.15)/1.15 'Space Mono',monospace;text-align:center;box-shadow:inset 0 0 0 3px #ffffff40}

.rbus{position:absolute;z-index:5;left:0;top:0;width:calc(100%/7);height:20%;display:grid;place-items:center;transform:rotate(var(--rot,0deg));transition:left .42s linear,top .42s linear,transform .3s ease}

.rbus-body i{position:absolute;display:block}
.rb-glass{right:3%;top:12%;bottom:12%;width:15%;background:#9fd0e6;border:2px solid #14324a;border-radius:3px 7px 7px 3px}
.rb-win{left:10%;right:24%;top:16%;height:22%;background:repeating-linear-gradient(90deg,#d8ecf5 0 17%,#14324a 17% 20%);border-radius:2px}.rb-win.b{top:auto;bottom:16%}

.chip{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 7px;border-radius:6px;border:2px solid #fff;background:var(--c);color:var(--t);font-size:16px;font-weight:700;white-space:nowrap}

/* ===== JOGO 3: CHEFÃO BUG ===== */
.g-bug{--c:var(--red);height:100%;display:grid;grid-template-columns:minmax(0,1.25fr) clamp(290px,31cqw,390px);gap:14px}
.arena{position:relative;min-height:0;display:flex;flex-direction:column;border:3px solid #e3e1d2;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(0deg,#ffffff0d 0 2px,transparent 2px 16px),repeating-linear-gradient(90deg,#ffffff0d 0 2px,transparent 2px 16px),linear-gradient(180deg,#1a1033,#2b1b57 55%,#3a2a6b)}
.bug-hud{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#0008;font:700 11px/1 'Space Mono',monospace}.hpbox{flex:1}.hpbar{height:16px;border:2px solid #fff;background:#000;margin-top:5px}.hpbar i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,#ff5a4d 0 10px,#d83a2e 10px 12px);transition:width .5s steps(8)}.lives{font-size:18px;letter-spacing:2px}

@keyframes bug-hit{20%{transform:translateX(-14px);filter:brightness(2.5) saturate(0)}60%{transform:translateX(14px);filter:brightness(2.5)}}@keyframes bug-atk{50%{transform:scale(1.3) translateY(24px)}}
.dmg{position:absolute;top:24%;left:56%;font:700 28px/1 'Space Mono',monospace;color:#ffe27a;text-shadow:2px 2px 0 #000;opacity:0}.dmg.go{animation:dmg-up .9s steps(8) 1}@keyframes dmg-up{0%{opacity:1}100%{opacity:0;transform:translateY(-42px)}}
.max{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;max-width:72%}.max .av{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #fff;box-shadow:0 4px 0 #0007,0 0 0 3px var(--c,var(--red))}
.app-max .av{width:65px;height:65px}
.say{position:relative;background:#f7faf7;color:var(--ink);border:2px solid #fff;border-radius:6px;padding:9px 12px;font-size:13px;line-height:1.4}.say:before{content:"";position:absolute;left:-8px;bottom:12px;border:8px solid transparent;border-right-color:#f7faf7;border-left:0}.say b{display:block;color:var(--title);font-size:12px}
.cat{display:inline-block;margin-bottom:10px;padding:5px 9px;border-radius:4px;background:var(--amber);color:var(--ink);font:700 11px/1 'Space Mono',monospace}
.bug-q{margin:0 0 12px;font-size:16px;font-weight:600;line-height:1.4}
.fact{padding:12px;border-radius:6px;background:#fff3d9;color:var(--ink);border-left:5px solid var(--amber);margin:6px 0 12px;line-height:1.5;font-size:14px}.fact b{display:block;color:var(--title);margin-bottom:4px}

function tone(freq,duration,volume,type='sine',end=freq){const t=mapAudio.currentTime,o=mapAudio.createOscillator(),g=mapAudio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(mapMaster);o.start(t);o.stop(t+duration+.02)}

const BUS_LAP_SECONDS=19.5,BUS_LAP_GIFT=10;
function busLap(el){
 if(!el.getAnimations)return -1;
 const anim=el.getAnimations().find(a=>a.effect&&a.effect.getTiming);
 if(!anim)return -1;
 const delayMs=anim.effect.getTiming().delay||0;
 let ct=anim.currentTime;if(ct&&typeof ct==='object')ct=ct.value;
 if(typeof ct!=='number')return -1;
 const iterMs=ct-delayMs;
 return iterMs<0?-1:Math.floor(iterMs/1000/BUS_LAP_SECONDS)+1;
}
const buses=[...site.querySelectorAll('.school-bus')].map(el=>({el,lastGiftLap:-1}));
function busGiftUpdate(){buses.forEach(b=>{const lap=busLap(b.el);b.el.classList.toggle('gift-ready',!motion.matches&&lap>0&&lap%BUS_LAP_GIFT===0&&lap!==b.lastGiftLap)})}

 site.querySelectorAll('.bus-gift-sticky').forEach(n=>n.remove());

}
function busClick(b){
 if(b.el.dataset.busy)return;
 const lap=busLap(b.el);
 if(lap>0&&lap%BUS_LAP_GIFT===0&&lap!==b.lastGiftLap){
  b.lastGiftLap=lap;b.el.classList.remove('gift-ready');b.el.dataset.busy='1';
  const premio=BRINDES_LISTA[rand(0,BRINDES_LISTA.length-1)];
  busGiftSticky(b.el,premio);
  try{window.tocarSomBrinde&&window.tocarSomBrinde()}catch(_){}
  soundStatus.textContent='Brinde do ônibus: '+premio+'! Procure a equipe SENAI para retirar.';
  setTimeout(()=>{delete b.el.dataset.busy},2600);
 }else{
  busFx(b.el,'🚌 Ônibus',true);
 }
}
buses.forEach(b=>{
 b.el.setAttribute('role','button');b.el.setAttribute('tabindex','0');
 b.el.setAttribute('aria-label','Ônibus do SENAI, clique para ver se há brinde');
 const handler=e=>{e.stopPropagation();busClick(b)};

/* ============================================================

const fsButton=document.getElementById('fs-control');
const fsRoot=document.documentElement;
let pseudoFs=false; // tela cheia "simulada" para navegadores sem Fullscreen API (ex.: iOS Safari)
function fsApi(){
 return {
  request:fsRoot.requestFullscreen||fsRoot.webkitRequestFullscreen||fsRoot.mozRequestFullScreen||fsRoot.msRequestFullscreen,
  exit:document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen,
  element:document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement
 };
}
function isFullscreen(){return !!fsApi().element||pseudoFs}
// calcula o tamanho real disponível na tela (descontando barras do navegador/teclado) para otimizar o encaixe do mapa
function applyScreenFit(){
 const vv=window.visualViewport;
 const w=Math.round(vv?vv.width:window.innerWidth);
 const h=Math.round(vv?vv.height:window.innerHeight);
 fsRoot.style.setProperty('--fs-w',w+'px');
 fsRoot.style.setProperty('--fs-h',h+'px');
}
function syncFullscreen(){
 const on=isFullscreen();
 fsButton.classList.toggle('is-on',on);
 fsButton.setAttribute('aria-pressed',String(on));
 fsButton.setAttribute('aria-label',on?'Sair da tela cheia':'Tela cheia');
 fsButton.title=on?'Sair da tela cheia':'Tela cheia';
 applyScreenFit();
 [0,150,400,800].forEach(ms=>setTimeout(()=>{applyScreenFit();window.dispatchEvent(new Event('resize'))},ms));
}
async function enterFullscreen(){
 const {request}=fsApi();
 if(request){
  try{await request.call(fsRoot,{navigationUI:'hide'});pseudoFs=false;syncFullscreen();return}
  catch(_){/* bloqueado pelo navegador: cai no modo alternativo abaixo */}
 }
 // modo alternativo: sem Fullscreen API (ou bloqueada), simula tela cheia usando o tamanho real da viewport
 pseudoFs=true;
 document.body.classList.add('pseudo-fs');
 window.scrollTo(0,1);
 if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});
 soundStatus.textContent='Tela cheia otimizada para este navegador.';
 syncFullscreen();
}
function exitFullscreen(){
 const {exit,element}=fsApi();
 if(element&&exit)exit.call(document);
 if(pseudoFs){
  pseudoFs=false;
  document.body.classList.remove('pseudo-fs');
  if(screen.orientation&&screen.orientation.unlock)try{screen.orientation.unlock()}catch(_){}
 }
 syncFullscreen();
}
fsButton.addEventListener('click',()=>isFullscreen()?exitFullscreen():enterFullscreen());
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('webkitfullscreenchange',syncFullscreen);
document.addEventListener('mozfullscreenchange',syncFullscreen);
document.addEventListener('MSFullscreenChange',syncFullscreen);
if(window.visualViewport){visualViewport.addEventListener('resize',applyScreenFit);visualViewport.addEventListener('scroll',applyScreenFit)}
window.addEventListener('orientationchange',()=>setTimeout(applyScreenFit,250));
applyScreenFit();

 listar(id){try{const saved=JSON.parse(localStorage.getItem('missao-dev-ranking-'+id)||'null');if(Array.isArray(saved))return saved.filter(x=>x&&typeof x.nome==='string'&&Number.isFinite(x.pontos)).sort((a,b)=>b.pontos-a.pontos).slice(0,100)}catch(_){}return [...(rankingMemory[id]||[])]}

const usedGiftCodes=new Set();
const TIPOS_CARTA=[{e:'🪲',c:'bug'},{e:'⭐',c:'bloco'},{e:'🔒',c:'lock'}];
const Brindes={
 timers:[],cards:new Set(),ganhos:0,
 parar(){this.timers.forEach(clearTimeout);this.timers=[];this.cards.forEach(c=>c.remove());this.cards.clear()},
 iniciar({container,duracaoSeg}){
  this.parar();this.ganhos=0;
  const qtd=rand(1,3),min=Math.ceil(duracaoSeg*.1),max=Math.floor(duracaoSeg*.9),slots=[];
  for(let t=0;slots.length<qtd&&t<80;t++){const s=rand(min,max);if(slots.every(x=>Math.abs(x-s)>=45))slots.push(s)}
  if(!slots.length)slots.push(min);
  slots.sort((a,b)=>a-b).forEach(s=>this.timers.push(setTimeout(()=>this.mostrar(container,false),s*1000)));
 },
 mostrar(container,permanente){
  if(!container||!container.isConnected)return;
  const tipo=TIPOS_CARTA[rand(0,2)],card=document.createElement('button');
  card.type='button';card.className='gift-card '+tipo.c;card.setAttribute('aria-label','Brinde escondido! Clique para pegar');card.textContent=tipo.e;
  card.style.left=rand(8,84)+'%';card.style.top=rand(20,78)+'%';
  container.append(card);this.cards.add(card);
  let expiry=null;
  if(!permanente){expiry=setTimeout(()=>{card.classList.add('expiring');this.timers.push(setTimeout(()=>{card.remove();this.cards.delete(card)},360))},6000);this.timers.push(expiry)}
  card.addEventListener('click',()=>{
   if(card.dataset.claimed)return;card.dataset.claimed='1';clearTimeout(expiry);this.ganhos++;tocarSomBrinde();
   const x=card.offsetLeft+31,y=card.offsetTop+31;
   for(let i=0;i<14;i++){const p=document.createElement('span');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',(Math.cos(i*Math.PI/7)*rand(34,90))+'px');p.style.setProperty('--dy',(Math.sin(i*Math.PI/7)*rand(34,90))+'px');container.append(p);setTimeout(()=>p.remove(),650)}
   card.remove();this.cards.delete(card);
   let code;do{code='DEV-'+String(rand(0,9999)).padStart(4,'0')}while(usedGiftCodes.has(code));usedGiftCodes.add(code);
   const d=dialogo('<h3 data-template-id="gift-heading" class="canva-text">🎁 Brinde conquistado!</h3><p class="gift-code"></p><p class="gift-name"></p><p data-template-id="gift-instruction" class="canva-text">Mostre este código ao monitor</p><div class="dialog-actions"><button type="button" data-template-id="gift-continue" class="canva-button action amber" data-close>Continuar a missão</button></div>');
   d.querySelector('.gift-code').textContent=code;d.querySelector('.gift-name').textContent=BRINDES_LISTA[rand(0,BRINDES_LISTA.length-1)];
   d.querySelector('[data-close]').onclick=()=>d.remove();d.querySelector('[data-close]').focus();
  });
 },
 final({container}){if(this.ganhos===0)this.mostrar(container,true)}   // garante pelo menos 1 brinde por partida
};

const ROBO_FASES=[
 {nome:'Sequência',map:['ggggggg','gggRRRG','gggRggg','RRRRggg','ggggggg'],start:[0,3],limite:14,sol:['F','F','F','L','F','F','R','F','F','F'],conceito:'Um programa é uma sequência de ordens, executadas uma de cada vez. Montem o caminho até o Galpão 05.'},
 {nome:'Curvas',map:['ggggRRG','ggggRgg','gRRRRgg','gRggggg','RRggggg'],start:[0,4],limite:18,sol:['F','L','F','F','R','F','F','F','L','F','F','R','F','F'],conceito:'Trechos pequenos juntos resolvem um problema grande, como acontece em equipe.'},
 {nome:'Repetição',map:['ggggggg','gggggRG','RRRRRRg','ggggggg','ggggggg'],start:[0,2],limite:8,sol:['X5','L','F','R','F'],conceito:'Quando uma ação se repete, usamos um laço (loop) em vez de escrever várias vezes. O limite é de 8 blocos: usem o 🔁 Repetir!'},
 {nome:'Condição',map:['RRRRRRg','ggGggRg','ggRggRg','ggRRRRg','ggggggg'],start:[0,0],regra:true,sol:{cond:'livre',entao:'F',senao:'R'},conceito:'O programa toma decisões: SE acontece uma coisa, faz uma ação; SENÃO, faz outra. Montem a regra, uma escolha por aluno.'},
 {nome:'Desafio final',map:['RRRRggg','gggRggg','gggRRRg','gggggRg','gggggRG'],start:[0,0],limite:10,sol:['X3','R','X2','L','X2','R','X2','L','F'],conceito:'Sequência, repetição e condição juntas: é assim que um desenvolvedor pensa. Limite de 10 blocos!'}
];
const ROBO_COND={livre:'caminho livre',bloqueado:'caminho bloqueado'};
const ROBO_ACOES={F:['⬆️','Andar'],L:['↰','Virar à esquerda'],R:['↱','Virar à direita']};
const roboAcaoTxt=k=>ROBO_ACOES[k][0]+' '+ROBO_ACOES[k][1];
const roboCmd=s=>({c:s[0],n:+s.slice(1)||1});
/* simulação pura (também usada no auto-teste) */
function roboSimular(f,prog,regra){
 const dirs=[[0,-1],[1,0],[0,1],[-1,0]];
 let x=f.start[0],y=f.start[1],ang=0;const est=[{x,y,ang}];
 const dir=()=>((1+Math.round(ang/90))%4+4)%4;
 const livre=(nx,ny)=>nx>=0&&nx<7&&ny>=0&&ny<5&&f.map[ny][nx]!=='g';
 const andar=()=>{const d=dirs[dir()],nx=x+d[0],ny=y+d[1];if(!livre(nx,ny)){est.push({x,y,ang,bump:true});return false}x=nx;y=ny;est.push({x,y,ang});return true};
 const noGol=()=>f.map[y][x]==='G';
 if(regra){
  for(let i=0;i<60;i++){
   const d=dirs[dir()],lv=livre(x+d[0],y+d[1]),ok=regra.cond==='livre'?lv:!lv,a=ok?regra.entao:regra.senao;
   if(a==='F'){if(!andar())return{est,res:'bateu'}}else{ang+=a==='L'?-90:90;est.push({x,y,ang})}
   if(noGol())return{est,res:'ok'};
  }
  return{est,res:'loop'};
 }
 for(const k of prog){
  if(k.c==='F'||k.c==='X'){const n=k.c==='X'?k.n:1;for(let i=0;i<n;i++)if(!andar())return{est,res:'bateu'}}
  else{ang+=k.c==='L'?-90:90;est.push({x,y,ang})}
 }
 return{est,res:noGol()?'ok':'curto'};
}
function roboAutoTeste(){ROBO_FASES.forEach((f,i)=>{const r=f.regra?roboSimular(f,[],f.sol):roboSimular(f,f.sol.map(roboCmd),null);return r.res==='ok'})}
roboAutoTeste();

function roboFit(){

  bug.classList.remove('hit','atk');void bug.offsetWidth;bug.classList.add('atk');
  say.textContent='O Bug contra-atacou! Dica: '+q[2];
 }
 nextTurn();
 const venceu=G.hp<=0,perdeu=G.vidas<=0,fim=venceu||perdeu;
 if(venceu)bug.className='bug dead';
 later(()=>{
  const side=overlay.querySelector('#bug-side');
  side.innerHTML='<h3>Você sabia?</h3><div class="fact"><b></b><span></span></div><button type="button" class="action amber" id="bug-next"></button>';
  side.querySelector('.fact b').textContent=ok?'Resposta certa!':'Quase!';side.querySelector('.fact span').textContent=q[3];
  const nb=side.querySelector('#bug-next');nb.textContent=fim?'Ver ranking':'Próxima ▶';nb.focus();
  nb.onclick=()=>fim?bugFim(venceu):bugPergunta();
 },fim?900:650);
}
function bugFim(venceu,msgOverride){
 if(!G||G.ranking)return;
 const extra=Math.max(0,G.vidas)*100+Math.min(100,Math.floor(G.seg/10))+(venceu?300:0);
 finalizar({
  titulo:venceu?'Bug derrotado!':'O Bug venceu desta vez',
  mensagem:msgOverride||(venceu?'Vocês derrotaram o Bug! Cada um usou o que aprendeu em TI: tela, lógica, dados e segurança. No curso Técnico em Desenvolvimento de Sistemas do SENAI é exatamente assim que se trabalha.':'As vidas acabaram, mas errar faz parte de aprender. Que tal tentar de novo?'),
  extra
 });
}

}
function somAlarme(){try{primeAudio();if(!giftAudio)return;const t0=giftAudio.currentTime+.02,dur=3,o=giftAudio.createOscillator(),g=giftAudio.createGain(),lp=giftAudio.createBiquadFilter();o.type='square';for(let i=0;i<dur/.2;i++)o.frequency.setValueAtTime(i%2?1500:900,t0+i*.2);lp.type='lowpass';lp.frequency.value=3200;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.06,t0+.03);g.gain.setValueAtTime(.06,t0+dur-.15);g.gain.linearRampToValueAtTime(.0001,t0+dur);o.connect(lp);lp.connect(g);g.connect(giftAudio.destination);o.start(t0);o.stop(t0+dur+.05)}catch(_){}
}
